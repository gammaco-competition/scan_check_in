<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#1a237e">
  <title>Check-in | GRG 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    :root {
      --navy: #1a237e; --navy-dark: #0d1440; --bg: #eef0f7; --card: #ffffff;
      --text: #1f2937; --muted: #6b7280; --line: #e5e7eb;
      --green: #15803d; --green-bg: #dcfce7; --amber: #b45309; --amber-bg: #fef3c7;
      --red: #b91c1c; --red-bg: #fee2e2;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: 'Prompt', sans-serif; background: var(--bg); color: var(--text); }
    header { background: var(--navy); color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 10;
             display: flex; align-items: center; justify-content: space-between; }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    header small { opacity: .8; font-size: .78rem; }
    main { max-width: 520px; margin: 0 auto; padding: 16px; }
    .hidden { display: none !important; }

    /* ---------- Scanner ---------- */
    .scan-card { background: #000; border-radius: 18px; overflow: hidden; position: relative; min-height: 300px; }
    #video { width: 100%; height: auto; display: block; min-height: 300px; object-fit: cover; background: #000; }
    .scan-frame { position: absolute; top: 50%; left: 50%; width: 62%; aspect-ratio: 1; transform: translate(-50%, -55%);
                  border: 3px solid rgba(255,255,255,.9); border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0,0,0,.35); pointer-events: none; }
    .scan-frame.hit { border-color: #22c55e; }
    .scan-hint { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; color: #fff;
                 font-size: .85rem; text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; }
    .start-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
                     justify-content: center; gap: 12px; color: #fff; background: #111827; text-align: center; padding: 20px; }
    .manual { margin-top: 14px; background: var(--card); border-radius: 14px; padding: 12px; display: flex; gap: 8px; }
    .manual input { flex: 1; min-width: 0; font: inherit; font-size: 1rem; padding: 12px; border: 1px solid var(--line);
                    border-radius: 10px; text-transform: uppercase; }

    .btn { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; font-size: .95rem; }
    .btn-primary { background: var(--navy); color: #fff; }
    .btn-primary:active { background: var(--navy-dark); }
    .btn-light { background: #fff; color: var(--navy); border: 1px solid #c5cae9; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-block { width: 100%; padding: 15px; font-size: 1rem; }
    .btn[disabled] { opacity: .5; }

    /* ---------- Result ---------- */
    .card { background: var(--card); border-radius: 18px; padding: 18px; box-shadow: 0 6px 20px rgba(0,0,0,.06); }
    .team-id { display: inline-block; background: var(--navy); color: #fff; font-weight: 700; font-size: 1.25rem;
               padding: 4px 14px; border-radius: 10px; letter-spacing: .5px; }
    .team-name { font-size: 1.25rem; font-weight: 700; margin: 10px 0 2px; line-height: 1.3; }
    .meta { color: var(--muted); font-size: .88rem; line-height: 1.5; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .badge { font-size: .78rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
    .b-green { background: var(--green-bg); color: var(--green); }
    .b-amber { background: var(--amber-bg); color: var(--amber); }
    .b-red { background: var(--red-bg); color: var(--red); }
    .b-gray { background: #f3f4f6; color: var(--muted); }
    .alert { margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-size: .88rem; font-weight: 500; }
    .alert-red { background: var(--red-bg); color: var(--red); }
    .alert-amber { background: var(--amber-bg); color: var(--amber); }

    .progress-wrap { margin: 18px 0 8px; }
    .progress-label { display: flex; justify-content: space-between; font-size: .9rem; font-weight: 600; margin-bottom: 6px; }
    .progress { height: 10px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
    .progress > div { height: 100%; background: var(--green); width: 0; transition: width .3s ease; }

    .member { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    .member:first-of-type { border-top: 0; }
    .num { width: 32px; height: 32px; border-radius: 50%; background: #e8eaf6; color: var(--navy); font-weight: 700;
           display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: .9rem; }
    .member.done .num { background: var(--green); color: #fff; }
    .m-info { flex: 1; min-width: 0; }
    .m-name { font-weight: 600; font-size: .98rem; word-break: break-word; }
    .m-time { font-size: .8rem; color: var(--green); font-weight: 500; }
    .m-btn { flex-shrink: 0; min-width: 96px; }
    .saving { font-size: .8rem; color: var(--muted); font-weight: 500; }
    .undo { background: none; border: 0; color: var(--muted); font: inherit; font-size: .78rem; text-decoration: underline; padding: 4px 0 0; cursor: pointer; }

    .actions { display: grid; gap: 10px; margin-top: 16px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff;
             padding: 10px 18px; border-radius: 999px; font-size: .9rem; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .loading { text-align: center; padding: 40px 0; color: var(--muted); }
    .spinner { width: 34px; height: 34px; border: 4px solid #c5cae9; border-top-color: var(--navy); border-radius: 50%;
               animation: spin 1s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>📷 Check-in หน้างาน</h1>
      <small>Global Robotics Games 2026</small>
    </div>
    <small id="counter"></small>
  </header>

  <main>
    <!-- ===== หน้าสแกน ===== -->
    <section id="scanView">
      <div class="scan-card">
        <video id="video" playsinline muted autoplay></video>
        <div class="scan-frame hidden" id="scanFrame"></div>
        <div class="scan-hint" id="scanHint">เล็ง QR ให้อยู่ในกรอบ ห่างประมาณ 15–25 ซม.</div>
        <div class="start-overlay" id="startOverlay">
          <div style="font-size:2.5rem">📷</div>
          <div id="startText">กำลังเปิดกล้อง…</div>
          <button class="btn btn-primary" id="liveBtn" onclick="startScanner()">📷 เปิดกล้องสแกนสด</button>
          <label class="btn btn-light" id="photoBtn">
            📸 ถ่ายรูป QR
            <input type="file" accept="image/*" capture="environment" style="display:none" onchange="scanPhoto(this)">
          </label>
          <div id="camError" style="font-size:.82rem;color:#fca5a5"></div>
        </div>
      </div>

      <form class="manual" onsubmit="manualLookup(event)">
        <input id="manualId" placeholder="หรือพิมพ์ Team ID เช่น EX-1" autocomplete="off" autocapitalize="characters">
        <button class="btn btn-primary" type="submit">ค้นหา</button>
      </form>
    </section>

    <!-- ===== ผลการสแกน ===== -->
    <section id="resultView" class="hidden"></section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    // ใส่ URL ของ Web App (Apps Script) ที่ Deploy แล้ว ลงท้ายด้วย /exec
    const API_URL = "https://script.google.com/macros/s/ใส่_DEPLOYMENT_ID_ที่นี่/exec";

    let scanning = false;
    let busy = false;
    let currentTeam = null;
    let sessionCount = 0;

    // ---------- ตัวช่วย ----------
    function esc(v) {
      return String(v === null || v === undefined ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove('show'), 2200);
    }

    // เปิดผ่าน Apps Script Web App หรือไม่
    const IN_GAS = (typeof google !== 'undefined' && google.script && google.script.run);

    function gasCall(fn, args) {
      return new Promise(resolve => {
        google.script.run
          .withSuccessHandler(res => resolve(res || { ok: false, error: 'ไม่ได้รับผลตอบกลับ' }))
          .withFailureHandler(err => resolve({ ok: false, error: (err && err.message) || String(err) }))
          [fn].apply(null, args);
      });
    }

    async function api(payload) {
      if (IN_GAS) {
        const call = payload.action === 'lookup'
          ? gasCall('lookupTeam', [payload.teamId])
          : gasCall('saveCheckin', [payload.teamId, payload.members, payload.checked]);
        const timeout = new Promise(r => setTimeout(() => r({ ok: false, error: 'หมดเวลาเชื่อมต่อ กรุณาลองใหม่' }), 30000));
        return Promise.race([call, timeout]);
      }
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 30000);
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          signal: ctrl.signal
        });
        const text = await res.text();
        try { return JSON.parse(text); }
        catch (e) { return { ok: false, error: 'เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (HTTP ' + res.status + ')' }; }
      } catch (err) {
        return { ok: false, error: err.name === 'AbortError' ? 'หมดเวลาเชื่อมต่อ กรุณาลองใหม่' : 'เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ต' };
      } finally {
        clearTimeout(timer);
      }
    }

    // ---------- กล้อง (สแกนสด: เจอ QR แล้วแสดงข้อมูลทันที) ----------
    let stream = null;
    let rafId = null;
    let lastTick = 0;
    let frameNo = 0;
    let detector = null;
    try {
      if ('BarcodeDetector' in window) detector = new BarcodeDetector({ formats: ['qr_code'] });
    } catch (e) { detector = null; }

    async function startScanner() {
      const err = document.getElementById('camError');
      err.textContent = '';
      document.getElementById('startText').textContent = 'กำลังเปิดกล้อง…';
      if (scanning) return;
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera api');
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        const video = document.getElementById('video');
        video.srcObject = stream;
        await video.play();

        // โฟกัสอัตโนมัติต่อเนื่อง (ถ้ากล้องรองรับ)
        try {
          const track = stream.getVideoTracks()[0];
          const caps = track.getCapabilities ? track.getCapabilities() : {};
          if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) {
            await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
          }
        } catch (e) {}

        scanning = true;
        busy = false;
        document.getElementById('startOverlay').classList.add('hidden');
        document.getElementById('scanFrame').classList.remove('hidden', 'hit');
        document.getElementById('scanHint').style.display = '';
        document.getElementById('scanHint').textContent = '📷 กำลังมองหา QR… ห่างประมาณ 15–25 ซม.';
        rafId = requestAnimationFrame(scanLoop);
      } catch (e) {
        await stopScanner();
        enablePhotoMode();
        err.textContent = IN_GAS
          ? 'หน้านี้เปิดผ่าน Apps Script ซึ่งไม่อนุญาตให้ใช้กล้องสด กรุณาใช้ "ถ่ายรูป QR" (ถ้าต้องการสแกนสด ให้ใช้หน้าบน GitHub Pages)'
          : 'เปิดกล้องสดไม่ได้ กรุณาอนุญาตการใช้กล้อง หรือใช้ "ถ่ายรูป QR" แทน';
      }
    }

    // อ่านภาพจากกล้องประมาณ 8 ครั้งต่อวินาที สลับอ่านทั้งภาพกับครอปกลางภาพ
    async function scanLoop(ts) {
      if (!scanning) return;
      const video = document.getElementById('video');
      if (ts - lastTick > 120 && video.readyState >= 2 && video.videoWidth) {
        lastTick = ts;
        frameNo++;
        let text = null;
        if (detector) {
          try {
            const found = await detector.detect(video);
            if (found && found.length) text = found[0].rawValue;
          } catch (e) {}
        }
        if (!text) {
          const crop = (frameNo % 2) ? 0.65 : 1;
          text = jsqrDecode(video, crop === 1 ? 900 : 700, crop);
        }
        if (text && scanning) {
          document.getElementById('scanFrame').classList.add('hit');
          onScanSuccess(text);
          return;
        }
      }
      rafId = requestAnimationFrame(scanLoop);
    }

    async function stopScanner() {
      scanning = false;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      const video = document.getElementById('video');
      if (video) video.srcObject = null;
      document.getElementById('scanFrame').classList.add('hidden');
      document.getElementById('startOverlay').classList.remove('hidden');
    }

    function enablePhotoMode() {
      document.getElementById('liveBtn').className = 'btn btn-light';
      document.getElementById('liveBtn').textContent = 'ลองเปิดกล้องสดอีกครั้ง';
      document.getElementById('photoBtn').className = 'btn btn-primary';
      document.getElementById('startText').textContent = 'กด "ถ่ายรูป QR" แล้วถ่ายให้ QR อยู่กลางภาพ';
      document.getElementById('scanHint').style.display = 'none';
    }

    function onScanSuccess(text) {
      if (busy) return;
      busy = true;                       // กันการอ่านซ้ำระหว่างหยุดกล้อง
      if (navigator.vibrate) navigator.vibrate(120);
      stopScanner();
      lookup(text);
    }

    // ---------- โหมดถ่ายรูป QR: อ่านจากรูปหลายวิธี ----------
    async function scanPhoto(input) {
      const file = input.files && input.files[0];
      input.value = '';
      if (!file) return;
      const err = document.getElementById('camError');
      err.textContent = 'กำลังอ่าน QR จากรูป…';
      const text = await decodeImageFile(file);
      if (text) {
        err.textContent = '';
        if (navigator.vibrate) navigator.vibrate(120);
        lookup(text);
      } else {
        err.textContent = 'อ่าน QR จากรูปไม่ได้ ลองถ่ายใหม่ให้ QR ใหญ่เกือบเต็มจอ ไม่เบลอ และไม่มีแสงสะท้อน หรือพิมพ์ Team ID แทน';
        if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
      }
    }

    async function loadBitmap(file) {
      try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) {}
      return await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    // ย่อ/ครอปรูปแล้วอ่านด้วย jsQR (รูปจากกล้องมือถือมักใหญ่เกินไปจนอ่านพลาด)
    function jsqrDecode(src, maxSide, cropRatio) {
      if (!window.jsQR) return null;
      const w0 = src.videoWidth || src.width, h0 = src.videoHeight || src.height;
      const cw = w0 * cropRatio, ch = h0 * cropRatio;
      const sx = (w0 - cw) / 2, sy = (h0 - ch) / 2;
      const scale = Math.min(1, maxSide / Math.max(cw, ch));
      const w = Math.max(1, Math.round(cw * scale)), h = Math.max(1, Math.round(ch * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(src, sx, sy, cw, ch, 0, 0, w, h);
      const data = ctx.getImageData(0, 0, w, h);
      const r = jsQR(data.data, w, h, { inversionAttempts: 'attemptBoth' });
      return r && r.data ? r.data : null;
    }

    async function decodeImageFile(file) {
      let bmp;
      try { bmp = await loadBitmap(file); } catch (e) { return null; }

      // 1) ตัวอ่าน QR ของระบบ (Chrome บน Android)
      if (detector) {
        try {
          const found = await detector.detect(bmp);
          if (found && found.length) return found[0].rawValue;
        } catch (e) {}
      }
      // 2) jsQR หลายขนาด และครอปตรงกลาง
      const tries = [[1000, 1], [1600, 1], [700, 1], [1000, 0.6], [1400, 0.45]];
      for (const [max, crop] of tries) {
        const t = jsqrDecode(bmp, max, crop);
        if (t) return t;
      }
      return null;
    }

    function manualLookup(e) {
      e.preventDefault();
      const v = document.getElementById('manualId').value.trim();
      if (!v) return;
      stopScanner();
      lookup(v);
    }

    // ---------- ค้นหาทีม ----------
    async function lookup(teamText) {
      busy = true;
      showResultView(`<div class="card loading"><div class="spinner"></div>พบ QR: <b>${esc(String(teamText).slice(0, 60))}</b><br>กำลังดึงข้อมูลทีม…</div>`);
      const res = await api({ action: 'lookup', teamId: teamText });
      busy = false;
      if (!res.ok) {
        showResultView(`
          <div class="card">
            <div class="alert alert-red" style="margin-top:0">❌ ${esc(res.error || 'ไม่พบข้อมูล')}</div>
            <div class="meta" style="margin-top:10px">ข้อความที่อ่านได้จาก QR: <b>${esc(teamText)}</b></div>
            <div class="actions"><button class="btn btn-primary btn-block" onclick="backToScan()">📷 สแกนใหม่</button></div>
          </div>`);
        if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
        return;
      }
      currentTeam = res.team;
      renderTeam();
    }

    function showResultView(html) {
      document.getElementById('scanView').classList.add('hidden');
      const rv = document.getElementById('resultView');
      rv.innerHTML = html;
      rv.classList.remove('hidden');
      window.scrollTo({ top: 0 });
    }

    function backToScan() {
      currentTeam = null;
      document.getElementById('resultView').classList.add('hidden');
      document.getElementById('scanView').classList.remove('hidden');
      document.getElementById('manualId').value = '';
      startScanner();
    }

    // ---------- แสดงข้อมูลทีม ----------
    function renderTeam() {
      const t = currentTeam;
      if (!t) return;
      const total = t.members.length;
      const done = t.members.filter(m => m.checkedAt).length;
      const pct = total ? Math.round(done * 100 / total) : 0;
      const isCancel = (t.status || '').toLowerCase() === 'cancel';

      const approvalBadge = {
        approved: '<span class="badge b-green">✓ อนุมัติแล้ว</span>',
        waiting:  '<span class="badge b-amber">⏳ รอตรวจสลิป</span>',
        unpaid:   '<span class="badge b-red">✕ ยังไม่ชำระเงิน</span>',
        unknown:  '<span class="badge b-gray">ไม่พบสถานะชำระเงิน</span>'
      }[t.approval] || '';

      let alerts = '';
      if (isCancel) alerts += '<div class="alert alert-red">⛔ ทีมนี้มีสถานะ Cancel (ยกเลิกแล้ว)</div>';
      else if (t.approval === 'unpaid') alerts += '<div class="alert alert-red">⚠️ ทีมนี้ยังไม่ได้ชำระเงิน กรุณาติดต่อเจ้าหน้าที่</div>';
      else if (t.approval === 'waiting') alerts += '<div class="alert alert-amber">⏳ ส่งสลิปแล้ว แต่ยังไม่ได้รับการอนุมัติ</div>';

      const membersHtml = total ? t.members.map(m => {
        let right, sub = '';
        if (m.saving) {
          sub = `<div class="saving">⏳ กำลังบันทึก…</div>`;
          right = '';
        } else if (m.checkedAt) {
          sub = `<div class="m-time">เช็คอินแล้ว ${esc(m.checkedAt)} น.</div>`;
          right = `<button class="undo" onclick="doCheckin([${m.n}], false)">ยกเลิก</button>`;
        } else {
          right = `<button class="btn btn-green m-btn" onclick="doCheckin([${m.n}], true)">เช็คอิน</button>`;
        }
        return `
        <div class="member ${m.checkedAt ? 'done' : ''}">
          <div class="num">${m.checkedAt ? '✓' : m.n}</div>
          <div class="m-info"><div class="m-name">${esc(m.name)}</div>${sub}</div>
          ${right}
        </div>`;
      }).join('') : '<div class="meta">ไม่พบรายชื่อสมาชิกของทีมนี้</div>';

      const pending = t.members.filter(m => !m.checkedAt && !m.saving).map(m => m.n);

      showResultView(`
        <div class="card">
          <span class="team-id">${esc(t.teamId)}</span>
          <div class="team-name">${esc(t.teamName || '-')}</div>
          <div class="meta">
            ${esc(t.institution || '-')}<br>
            ${esc(t.event || '')}${t.ageGroup ? ' · ' + esc(t.ageGroup) : ''}${t.category && t.category !== t.ageGroup ? ' · ' + esc(t.category) : ''}<br>
            ${t.coach ? 'โค้ช: ' + esc(t.coach) : ''}
          </div>
          <div class="badges">${approvalBadge}${isCancel ? '<span class="badge b-red">Cancel</span>' : ''}</div>
          ${alerts}

          <div class="progress-wrap">
            <div class="progress-label"><span>เช็คอินแล้ว</span><span>${done}/${total} คน</span></div>
            <div class="progress"><div style="width:${pct}%"></div></div>
          </div>

          ${membersHtml}

          <div class="actions">
            ${pending.length > 1 ? `<button class="btn btn-green btn-block" onclick="doCheckin([${pending.join(',')}], true)">✓ เช็คอินทุกคนที่เหลือ (${pending.length} คน)</button>` : ''}
            <button class="btn btn-primary btn-block" onclick="backToScan()">📷 สแกนทีมถัดไป</button>
          </div>
        </div>`);
    }

    // ---------- เช็คอิน / ยกเลิก (แสดงผลทันที แล้วบันทึกเบื้องหลัง) ----------
    const inFlight = new Set();   // "TEAMID#n" ที่กำลังบันทึก

    async function doCheckin(nums, checked) {
      if (!currentTeam) return;
      const t = currentTeam;
      if (checked && (t.status || '').toLowerCase() === 'cancel') {
        if (!confirm('ทีมนี้มีสถานะ Cancel ต้องการเช็คอินต่อหรือไม่?')) return;
      }
      if (checked && t.approval === 'unpaid') {
        if (!confirm('ทีมนี้ยังไม่ได้ชำระเงิน ต้องการเช็คอินต่อหรือไม่?')) return;
      }
      if (!checked && !confirm('ยกเลิกการเช็คอินของสมาชิกคนนี้?')) return;

      // 1) อัปเดตหน้าจอทันที
      const teamId = t.teamId;
      const before = {};
      nums.forEach(n => {
        const m = t.members.find(x => x.n === n);
        if (!m) return;
        before[n] = m.checkedAt;
        m.checkedAt = checked ? 'now' : '';
        m.saving = true;
        inFlight.add(teamId + '#' + n);
      });
      if (checked && navigator.vibrate) navigator.vibrate(60);
      renderTeam();

      // 2) บันทึกเบื้องหลัง
      const res = await api({ action: 'checkin', teamId: teamId, members: nums, checked: checked });
      nums.forEach(n => inFlight.delete(teamId + '#' + n));

      const stillHere = currentTeam && currentTeam.teamId === teamId;
      if (!res.ok) {
        toast('❌ ' + teamId + ': ' + (res.error || 'บันทึกไม่สำเร็จ'));
        if (stillHere) {
          nums.forEach(n => {
            const m = currentTeam.members.find(x => x.n === n);
            if (m) { m.checkedAt = before[n]; m.saving = false; }
          });
          renderTeam();
        }
        return;
      }

      if (checked) {
        sessionCount += nums.length;
        document.getElementById('counter').textContent = 'เช็คอินรอบนี้ ' + sessionCount + ' คน';
      }
      if (!stillHere) { toast('✅ บันทึก ' + teamId + ' เรียบร้อย'); return; }

      // 3) รวมผลจากเซิร์ฟเวอร์ (ไม่ทับคนที่ยังกำลังบันทึกอยู่)
      (res.members || []).forEach(sm => {
        const m = currentTeam.members.find(x => x.n === sm.n);
        if (!m || inFlight.has(teamId + '#' + sm.n)) return;
        m.checkedAt = sm.checkedAt;
        m.saving = false;
      });
      renderTeam();
      toast(checked ? '✅ บันทึกเรียบร้อย' : 'ยกเลิกการเช็คอินแล้ว');
    }

    // เริ่มต้น: เปิดกล้องสแกนสดอัตโนมัติ (ถ้าเปิดไม่ได้จะสลับเป็นโหมดถ่ายรูป)
    startScanner();
  </script>
</body>
</html>
