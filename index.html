<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>QR Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    :root{
      --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
      --brand:#2563eb; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Prompt',system-ui,sans-serif}
    .wrap{max-width:520px;margin:0 auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
    header h1{font-size:20px;margin:0}
    .chip{font-size:12px;padding:4px 10px;border-radius:99px;background:#e0e7ff;color:#3730a3}
    .card{background:var(--card);border-radius:18px;box-shadow:0 4px 18px rgba(15,23,42,.06);padding:14px;margin-bottom:12px}
    .notice{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;background:#fef3c7;color:#92400e;display:none}

    /* กล้อง */
    .viewer{position:relative;width:100%;aspect-ratio:1/1;background:#0b1220;border-radius:14px;overflow:hidden}
    .viewer video{width:100%;height:100%;object-fit:cover;display:block}
    .viewer .frame{position:absolute;inset:16%;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.9)}
    .viewer .frame.hit{border-color:#22c55e}
    .viewer .hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #000}
    .viewer .idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cbd5e1;text-align:center;padding:20px;font-size:14px;gap:6px}
    .viewer .idle b{font-size:40px}
    .tools{position:absolute;top:10px;right:10px;display:flex;gap:6px}
    .tools button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(15,23,42,.6);color:#fff;font-size:18px}

    .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    button.b{border:0;border-radius:12px;padding:13px 10px;font:600 15px 'Prompt',sans-serif;cursor:pointer}
    .b-primary{background:var(--brand);color:#fff}
    .b-light{background:#e2e8f0;color:var(--ink)}
    .b-ok{background:var(--ok);color:#fff}
    .b-warn{background:var(--warn);color:#fff}
    .b:disabled{opacity:.55}
    .full{grid-column:1/-1}

    .manual{display:flex;gap:8px;margin-top:10px}
    .manual input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;font:500 16px 'Prompt',sans-serif}
    .manual button{width:auto;padding:0 16px}
    .opt{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted)}
    .opt input{width:20px;height:20px}

    /* ผลลัพธ์ */
    #result{display:none}
    .status{border-radius:14px;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:center;margin-bottom:10px}
    .status .ic{font-size:26px}
    .status small{display:block;font-weight:400;opacity:.9}
    .s-load{background:#e0e7ff;color:#3730a3}
    .s-ok{background:#dcfce7;color:#166534}
    .s-warn{background:#fef3c7;color:#92400e}
    .s-bad{background:#fee2e2;color:#991b1b}
    .s-info{background:#e0f2fe;color:#075985}
    .idbig{font:700 26px 'Prompt',sans-serif;letter-spacing:.5px;margin:2px 0 8px;word-break:break-all}
    table.f{width:100%;border-collapse:collapse;font-size:15px}
    table.f td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
    table.f td:first-child{color:var(--muted);width:38%}
    .spin{width:22px;height:22px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}

    /* ประวัติ */
    .hist h3{font-size:15px;margin:0 0 6px}
    .hist ul{list-style:none;margin:0;padding:0;font-size:14px}
    .hist li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
    .hist li span:last-child{color:var(--muted);white-space:nowrap}
    .muted{color:var(--muted);font-size:13px}
    input[type=file]{display:none}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📷 QR Scanner</h1>
    <span class="chip" id="modeChip">…</span>
  </header>

  <div class="notice" id="notice"></div>

  <!-- สแกน -->
  <div class="card" id="scanCard">
    <div class="viewer" id="viewer">
      <video id="video" playsinline muted autoplay></video>
      <div class="frame" id="frame" style="display:none"></div>
      <div class="hint" id="hint" style="display:none">เล็ง QR ให้อยู่ในกรอบ</div>
      <div class="idle" id="idle"><b>▢</b>กด "เปิดกล้อง" เพื่อสแกนสด<br>หรือ "ถ่ายรูป QR" ถ้ากล้องสดใช้ไม่ได้</div>
      <div class="tools" id="tools" style="display:none">
        <button id="torchBtn" title="ไฟฉาย" style="display:none">🔦</button>
        <button id="stopBtn" title="ปิดกล้อง">✕</button>
      </div>
    </div>
    <div class="btns">
      <button class="b b-primary" id="camBtn">🎥 เปิดกล้อง</button>
      <button class="b b-light" id="photoBtn">📸 ถ่ายรูป QR</button>
    </div>
    <input type="file" id="photoInput" accept="image/*" capture="environment">
    <div class="manual">
      <input id="manualInput" placeholder="หรือพิมพ์รหัส แล้วกดค้นหา" autocomplete="off" enterkeyhint="search">
      <button class="b b-light" id="manualBtn">ค้นหา</button>
    </div>
    <label class="opt"><input type="checkbox" id="autoChk"> เช็คอินอัตโนมัติทันทีที่สแกนเจอ</label>
  </div>

  <!-- ผลลัพธ์ -->
  <div class="card" id="result">
    <div class="status s-load" id="status"></div>
    <div class="idbig" id="resId"></div>
    <table class="f" id="fields"></table>
    <div class="btns" id="actions"></div>
  </div>

  <!-- ประวัติในเครื่องนี้ -->
  <div class="card hist">
    <h3>ประวัติการสแกน (เครื่องนี้)</h3>
    <ul id="hist"><li class="muted">ยังไม่มี</li></ul>
  </div>
  <p class="muted" style="text-align:center">v1.0</p>
</div>

<script>
/* =================== ตั้งค่า =================== */
// ใช้เฉพาะตอนวางไฟล์นี้บน GitHub Pages: ใส่ URL /exec ของ Web App
// (ถ้าเปิดผ่าน Apps Script โดยตรง ไม่ต้องใส่)
const API_URL = 'https://script.google.com/macros/s/AKfycbySMkoP-XzEVVpzz2dgcGEh_UKDE5BJYCXuUAeU_u9eFmMqpAeEcjiSL5CWLxvZRZdS/exec';
const API_TIMEOUT_MS = 30000;
const SAME_CODE_COOLDOWN_MS = 4000;   // QR เดิมซ้ำภายในกี่ ms จะไม่อ่านซ้ำ
/* ============================================== */

const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const $ = id => document.getElementById(id);
const video = $('video');
const work = document.createElement('canvas');
const wctx = work.getContext('2d', { willReadFrequently: true });

let stream = null, scanning = false, busy = false, detector = null;
let lastCode = '', lastCodeAt = 0, torchOn = false, rafId = 0, lastTick = 0, frameNo = 0;
let current = null; // ผลลัพธ์ล่าสุด

/* ---------- เรียก Backend (Apps Script / GitHub) ---------- */
function api(payload) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('หมดเวลาเชื่อมต่อ กรุณาลองใหม่')), API_TIMEOUT_MS);
    const done = (fn, v) => { clearTimeout(timer); fn(v); };
    if (IN_GAS) {
      google.script.run
        .withSuccessHandler(r => done(resolve, r))
        .withFailureHandler(e => done(reject, e))
        .api(payload);
    } else if (API_URL) {
      fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
        .then(r => r.json()).then(r => done(resolve, r)).catch(e => done(reject, e));
    } else {
      done(reject, new Error('ยังไม่ได้ตั้งค่า API_URL'));
    }
  });
}

/* ---------- เริ่มต้น ---------- */
(function init() {
  $('modeChip').textContent = IN_GAS ? 'Apps Script' : (API_URL ? 'Web + API' : 'ยังไม่ตั้งค่า API');
  const ua = navigator.userAgent || '';
  if (/Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(ua)) {
    showNotice('⚠️ กำลังเปิดในแอป (LINE/Facebook) กล้องอาจใช้ไม่ได้ — กด ⋮ หรือ ⋯ แล้วเลือก "เปิดในเบราว์เซอร์" (Safari/Chrome)');
  } else if (!IN_GAS && !API_URL) {
    showNotice('⚠️ ยังไม่ได้ใส่ API_URL ในไฟล์ Index.html');
  }
  try { $('autoChk').checked = localStorage.getItem('qr_auto') === '1'; } catch (e) {}
  $('autoChk').onchange = () => { try { localStorage.setItem('qr_auto', $('autoChk').checked ? '1' : '0'); } catch (e) {} };
  $('camBtn').onclick = startCamera;
  $('stopBtn').onclick = stopCamera;
  $('torchBtn').onclick = toggleTorch;
  $('photoBtn').onclick = () => { $('photoInput').value = ''; $('photoInput').click(); };
  $('photoInput').onchange = onPhoto;
  $('manualBtn').onclick = () => { const v = $('manualInput').value.trim(); if (v) { $('manualInput').blur(); handleCode(v); } };
  $('manualInput').onkeydown = e => { if (e.key === 'Enter') $('manualBtn').click(); };
  renderHist();
  initDetector();
  document.addEventListener('visibilitychange', () => { if (document.hidden && stream) stopCamera(); });
})();

async function initDetector() {
  try {
    if ('BarcodeDetector' in window) {
      const f = await BarcodeDetector.getSupportedFormats();
      if (f.includes('qr_code')) detector = new BarcodeDetector({ formats: ['qr_code'] });
    }
  } catch (e) { detector = null; }
}

function showNotice(msg) { const n = $('notice'); n.innerHTML = msg; n.style.display = msg ? 'block' : 'none'; }

/* ---------- กล้องสด ---------- */
async function startCamera() {
  if (stream) { resumeScan(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return cameraFailed('เบราว์เซอร์นี้เปิดกล้องสดไม่ได้');
  }
  $('camBtn').disabled = true; $('camBtn').textContent = 'กำลังเปิดกล้อง…';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
    $('idle').style.display = 'none';
    ['frame', 'hint', 'tools'].forEach(id => $(id).style.display = '');
    const track = stream.getVideoTracks()[0];
    const caps = track && track.getCapabilities ? track.getCapabilities() : {};
    $('torchBtn').style.display = caps && caps.torch ? '' : 'none';
    $('camBtn').textContent = '⏸ หยุดสแกน';
    $('camBtn').onclick = () => (scanning ? pauseScan() : resumeScan());
    resumeScan();
  } catch (err) {
    stream = null;
    const name = (err && err.name) || '';
    let msg = 'เปิดกล้องสดไม่ได้';
    if (name === 'NotAllowedError') msg = IN_GAS
      ? 'หน้าเว็บ Apps Script ไม่อนุญาตให้ใช้กล้องสด'
      : 'ไม่ได้รับอนุญาตให้ใช้กล้อง (ตรวจสิทธิ์กล้องของเบราว์เซอร์ใน Settings)';
    else if (name === 'NotFoundError') msg = 'ไม่พบกล้องในเครื่องนี้';
    else if (name === 'NotReadableError') msg = 'กล้องถูกแอปอื่นใช้อยู่';
    cameraFailed(msg);
  } finally {
    $('camBtn').disabled = false;
  }
}

function cameraFailed(msg) {
  showNotice('⚠️ ' + msg + ' — ใช้ปุ่ม <b>📸 ถ่ายรูป QR</b> แทนได้เลย');
  $('camBtn').textContent = '🎥 เปิดกล้อง';
  $('idle').innerHTML = '<b>📸</b>กดปุ่ม "ถ่ายรูป QR"<br>ระบบจะเปิดกล้องของเครื่องให้ถ่าย';
}

function stopCamera() {
  pauseScan();
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; torchOn = false;
  video.srcObject = null;
  $('idle').style.display = '';
  ['frame', 'hint', 'tools'].forEach(id => $(id).style.display = 'none');
  $('camBtn').textContent = '🎥 เปิดกล้อง';
  $('camBtn').onclick = startCamera;
}

function pauseScan() {
  scanning = false; cancelAnimationFrame(rafId);
  if (stream) { $('camBtn').textContent = '▶️ สแกนต่อ'; $('hint').textContent = 'หยุดสแกนชั่วคราว'; }
}
function resumeScan() {
  if (!stream) return startCamera();
  scanning = true; $('frame').classList.remove('hit');
  $('camBtn').textContent = '⏸ หยุดสแกน'; $('hint').textContent = 'เล็ง QR ให้อยู่ในกรอบ';
  rafId = requestAnimationFrame(tick);
}

async function toggleTorch() {
  try {
    const track = stream && stream.getVideoTracks()[0];
    if (!track) return;
    torchOn = !torchOn;
    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
  } catch (e) { torchOn = false; }
}

async function tick(ts) {
  if (!scanning) return;
  if (ts - lastTick < 110 || busy || video.readyState < 2) { rafId = requestAnimationFrame(tick); return; }
  lastTick = ts; busy = true;
  try {
    const text = await decodeVideoFrame();
    if (text) onDetected(text);
  } catch (e) { /* ข้ามเฟรมนี้ */ }
  busy = false;
  if (scanning) rafId = requestAnimationFrame(tick);
}

async function decodeVideoFrame() {
  if (detector) {
    const codes = await detector.detect(video);
    if (codes && codes.length) return codes[0].rawValue;
    return '';
  }
  if (typeof jsQR !== 'function') return '';
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return '';
  // สลับระหว่าง "ทั้งภาพ" กับ "เฉพาะกลางภาพ" ทุกเฟรม → QR เล็ก/ไกลก็ยังอ่านได้
  frameNo++;
  let sx = 0, sy = 0, sw = vw, sh = vh;
  if (frameNo % 2 === 0) { const s = Math.min(vw, vh) * 0.7; sx = (vw - s) / 2; sy = (vh - s) / 2; sw = sh = s; }
  const scale = Math.min(1, 640 / Math.max(sw, sh));
  const w = Math.round(sw * scale), h = Math.round(sh * scale);
  work.width = w; work.height = h;
  wctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
  const img = wctx.getImageData(0, 0, w, h);
  const r = jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
  return r && r.data ? r.data : '';
}

function onDetected(text) {
  const now = Date.now();
  if (text === lastCode && now - lastCodeAt < SAME_CODE_COOLDOWN_MS) return;
  lastCode = text; lastCodeAt = now;
  $('frame').classList.add('hit');
  feedback();
  pauseScan();
  handleCode(text);
}

/* ---------- ถ่ายรูป QR (ใช้ได้ทุกที่ รวมถึงใน Apps Script) ---------- */
async function onPhoto(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  setStatus('load', 'กำลังอ่าน QR จากรูป…');
  showResult('', []);
  try {
    const img = await loadImage(file);
    const text = await decodeImage(img);
    if (!text) {
      setStatus('bad', 'อ่าน QR ไม่ได้', 'ถ่ายใหม่ให้ QR ชัดและเต็มกรอบมากขึ้น หรือเพิ่มแสง');
      setActions([['📸 ถ่ายใหม่', 'b-primary full', () => $('photoBtn').click()]]);
      return;
    }
    feedback();
    handleCode(text);
  } catch (err) {
    setStatus('bad', 'เปิดรูปไม่ได้', String(err && err.message || err));
  }
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { resolve(img); setTimeout(() => URL.revokeObjectURL(url), 1000); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('ไฟล์รูปไม่รองรับ')); };
    img.src = url;
  });
}

async function decodeImage(img) {
  if (detector) {
    try { const c = await detector.detect(img); if (c && c.length) return c[0].rawValue; } catch (e) {}
  }
  if (typeof jsQR !== 'function') return '';
  const W = img.naturalWidth, H = img.naturalHeight;
  // ลองหลายขนาด + ครอปกลางภาพ (รูปจากมือถือใหญ่มาก ต้องย่อก่อน)
  const tries = [[1, 1000], [0.6, 900], [1, 1600], [1, 600], [0.4, 800]];
  for (const [crop, max] of tries) {
    const sw = W * crop, sh = H * crop, sx = (W - sw) / 2, sy = (H - sh) / 2;
    const scale = Math.min(1, max / Math.max(sw, sh));
    const w = Math.round(sw * scale), h = Math.round(sh * scale);
    work.width = w; work.height = h;
    wctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
    const r = jsQR(wctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
    if (r && r.data) return r.data;
    await new Promise(r => setTimeout(r, 0)); // ไม่ให้หน้าค้าง
  }
  return '';
}

/* ---------- ประมวลผลรหัส ---------- */
function extractId(raw) {
  let s = String(raw || '').trim();
  if (/^https?:\/\//i.test(s)) {
    const m = s.match(/[?&](id|code|teamId|key)=([^&#]+)/i);
    if (m) { try { s = decodeURIComponent(m[2].replace(/\+/g, ' ')); } catch (e) { s = m[2]; } }
  }
  return s.trim();
}

async function handleCode(raw) {
  const id = extractId(raw);
  if (!id) return;
  current = { id };
  showResult(id, []);
  const auto = $('autoChk').checked;
  setStatus('load', auto ? 'กำลังเช็คอิน…' : 'กำลังค้นหาข้อมูล…');
  setActions([]);
  $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  try {
    const res = await api({ action: auto ? 'checkin' : 'lookup', id, device: deviceName() });
    if (current.id !== id) return; // มีการสแกนใหม่ระหว่างรอ
    renderResult(res, auto);
  } catch (err) {
    setStatus('bad', 'เชื่อมต่อไม่สำเร็จ', String(err && err.message || err));
    setActions([['🔁 ลองใหม่', 'b-primary', () => handleCode(id)], ['📷 สแกนต่อ', 'b-light', scanNext]]);
  }
}

async function doCheckin(id, force) {
  setStatus('load', 'กำลังบันทึก…');
  setActions([]);
  try {
    const res = await api({ action: 'checkin', id, force: !!force, device: deviceName() });
    renderResult(res, true);
  } catch (err) {
    setStatus('bad', 'บันทึกไม่สำเร็จ', String(err && err.message || err));
    setActions([['🔁 ลองบันทึกอีกครั้ง', 'b-primary', () => doCheckin(id, force)], ['📷 สแกนต่อ', 'b-light', scanNext]]);
  }
}

function renderResult(res, wasCheckin) {
  if (!res || !res.ok) {
    setStatus('bad', 'เกิดข้อผิดพลาด', (res && res.error) || 'ไม่ทราบสาเหตุ');
    setActions([['📷 สแกนต่อ', 'b-primary full', scanNext]]);
    return;
  }
  current = res;
  showResult(res.id, res.fields || []);
  if (!res.found) {
    setStatus('bad', 'ไม่พบข้อมูล', 'รหัสนี้ไม่มีในระบบ');
    addHist(res.id, 'ไม่พบ');
    setActions([['📷 สแกนต่อ', 'b-primary full', scanNext]]);
    return;
  }
  const scanBtn = ['📷 สแกนต่อ', 'b-light', scanNext];
  if (res.duplicate) {
    setStatus('warn', 'เคยเช็คอินแล้ว', 'เมื่อ ' + res.checkedAt);
    addHist(res.id, 'ซ้ำ');
    setActions([['บันทึกซ้ำ', 'b-warn', () => doCheckin(res.id, true)], scanBtn]);
  } else if (res.saved) {
    setStatus('ok', 'เช็คอินสำเร็จ ✓', res.checkedAt);
    addHist(res.id, 'เช็คอิน');
    setActions([['📷 สแกนคนถัดไป', 'b-primary full', scanNext]]);
    if (wasCheckin && $('autoChk').checked && stream) setTimeout(() => { if (current === res) scanNext(); }, 1500); // โหมดอัตโนมัติ
  } else if (res.checkedAt) {
    setStatus('warn', 'เคยเช็คอินแล้ว', 'เมื่อ ' + res.checkedAt);
    setActions([['บันทึกซ้ำ', 'b-warn', () => doCheckin(res.id, true)], scanBtn]);
  } else {
    setStatus('info', 'พบข้อมูล', res.hasStatus ? 'ยังไม่ได้เช็คอิน' : '');
    setActions([['✅ เช็คอิน', 'b-ok', () => doCheckin(res.id, false)], scanBtn]);
  }
}

function scanNext() {
  $('result').style.display = 'none';
  current = null;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (stream) resumeScan();
}

/* ---------- UI helpers ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function showResult(id, fields) {
  $('result').style.display = 'block';
  $('resId').textContent = id || '';
  $('fields').innerHTML = (fields || []).map(f => `<tr><td>${esc(f.label)}</td><td>${esc(f.value) || '-'}</td></tr>`).join('');
}

function setStatus(type, title, sub) {
  const icons = { load: '<span class="spin"></span>', ok: '✅', warn: '⚠️', bad: '❌', info: '🔎' };
  const el = $('status');
  el.className = 'status s-' + type;
  el.innerHTML = `<span class="ic">${icons[type] || ''}</span><div>${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
}

function setActions(list) {
  const box = $('actions');
  box.innerHTML = '';
  list.forEach(([label, cls, fn]) => {
    const b = document.createElement('button');
    b.className = 'b ' + cls; b.textContent = label; b.onclick = fn;
    box.appendChild(b);
  });
}

function feedback() {
  try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    feedback.ctx = feedback.ctx || new AC();
    const o = feedback.ctx.createOscillator(), g = feedback.ctx.createGain();
    o.frequency.value = 1100; g.gain.value = 0.08;
    o.connect(g); g.connect(feedback.ctx.destination);
    o.start(); o.stop(feedback.ctx.currentTime + 0.09);
  } catch (e) {}
}

function deviceName() {
  const ua = navigator.userAgent || '';
  const os = /iPhone|iPad/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : 'Other';
  const br = /CriOS|Chrome/.test(ua) ? 'Chrome' : /Safari/.test(ua) ? 'Safari' : 'Browser';
  return os + ' / ' + br;
}

function addHist(id, label) {
  let h = [];
  try { h = JSON.parse(localStorage.getItem('qr_hist') || '[]'); } catch (e) {}
  const t = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  h.unshift({ id, label, t });
  h = h.slice(0, 15);
  try { localStorage.setItem('qr_hist', JSON.stringify(h)); } catch (e) {}
  renderHist(h);
}

function renderHist(h) {
  if (!h) { try { h = JSON.parse(localStorage.getItem('qr_hist') || '[]'); } catch (e) { h = []; } }
  $('hist').innerHTML = h.length
    ? h.map(x => `<li><span><b>${esc(x.id)}</b> · ${esc(x.label)}</span><span>${esc(x.t)}</span></li>`).join('')
    : '<li class="muted">ยังไม่มี</li>';
}
</script>
